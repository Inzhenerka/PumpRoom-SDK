name: Publish to npm on version

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: 🔧 Build and test
    runs-on: ubuntu-latest
    steps:
      - name: 👋 Checkout
        uses: actions/checkout@v6

      - name: ⚙️ Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: 💪 Install deps
        run: bun install --frozen-lockfile

      - name: 🏷️ Verify package version
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${package_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}" >&2
            exit 1
          fi

      - name: 🧪 Test
        run: bun run test

      - name: 🔧 Build
        run: bun run build

      - name: 📁 Create dist archive
        run: |
          cd dist
          tar -czf ../dist-${{ github.ref_name }}.tar.gz .
          cd ..

      - name: 📦 Pack npm package
        run: |
          mkdir -p npm-package
          npm pack --ignore-scripts --pack-destination npm-package

      - name: 📤 Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error

      - name: 📤 Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: dist-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

      - name: 📤 Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm-package/*.tgz
          if-no-files-found: error

  publish-npm:
    name: 📦 Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 Download npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: 📦 Publish package
        run: npm publish ./npm-package/*.tgz --ignore-scripts

  release:
    name: 🚀 Release
    needs: [build, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - name: 📥 Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: 📥 Download release archive
        uses: actions/download-artifact@v4
        with:
          name: release-archive

      - name: ⚙️ Install AWS CLI
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          verbose: false
          arch: amd64

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔼 Upload site
        run: |
          AWS_ACCESS_KEY_ID=${{ secrets.ACCESS_KEY_ID }} \
          AWS_SECRET_ACCESS_KEY=${{ secrets.SECRET_ACCESS_KEY }} \
          aws s3 sync "dist/" "s3://pumproom-sdk-site/" \
            --endpoint-url https://storage.yandexcloud.net
        shell: bash

      - name: 🔃 Purge CDN cache
        uses: yc-actions/yc-cdn-cache@v2
        with:
          yc-sa-json-credentials: ${{ secrets.yc_sa_json_credentials }}
          cdn-resource-id: bc8rsghmnpm27w7z5ppm

      - name: 🏁 Create GitHub deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: "${{ github.token }}"
          initial-status: success
          environment-url: https://pumproom-sdk.inzhenerka-cloud.com
          environment: prod
