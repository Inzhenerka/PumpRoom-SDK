name: Publish to npm on version

on:
  push:
    tags:
      - "v*"

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  build:
    name: 🔧 Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 👋 Checkout
        uses: actions/checkout@v6

      - name: ⚙️ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: 💪 Install deps
        run: bun install --frozen-lockfile

      - name: 🏷️ Verify package version
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${package_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}" >&2
            exit 1
          fi

      - name: 🧪 Test
        run: bun run test

      - name: 🎨 Check formatting
        run: bun run format:check

      - name: 🔎 Lint
        run: bun run lint

      - name: 🧩 Check types
        run: bun run check

      - name: 🔧 Build
        run: bun run build

      - name: 📁 Create dist archive
        run: |
          cd dist
          tar -czf ../dist-${{ github.ref_name }}.tar.gz .
          cd ..

      - name: 📦 Pack npm package
        run: |
          mkdir -p npm-package
          npm pack --ignore-scripts --pack-destination npm-package

      - name: 📤 Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: dist-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

      - name: 📤 Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm-package/*.tgz
          if-no-files-found: error

  publish-npm:
    name: 📦 Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 Download npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: 📦 Publish package
        run: npm publish ./npm-package/*.tgz --ignore-scripts --provenance

  deploy:
    name: 🚀 Deploy to production
    needs: [build, publish-npm]
    permissions:
      contents: read
      packages: write
      deployments: write
    uses: Inzhenerka/PumpRoom-CI/.github/workflows/deploy_coolify.yml@main
    with:
      environment: production
      url: https://pumproom-sdk.inzhenerka-cloud.com/
    secrets:
      coolify_webhook: ${{ secrets.COOLIFY_WEBHOOK }}
      coolify_token: ${{ secrets.COOLIFY_TOKEN }}

  release:
    name: 🚀 Release
    needs: [build, publish-npm, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Download release archive
        uses: actions/download-artifact@v4
        with:
          name: release-archive

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
